    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Mock Vite HMR WebSocket in cloud sandbox / preview environment where HMR WebSocket is not supported
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          function MockViteWebSocket(url, protocols) {
            var isVite = (protocols === 'vite-hmr') ||
                         (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                         (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1));
            if (isVite) {
              this.url = url;
              this.readyState = 0; // CONNECTING
              this.listeners = { open: [], message: [], close: [], error: [] };
              var self = this;
              setTimeout(function() {
                self.readyState = 1; // OPEN
                if (typeof self.onopen === 'function') {
                  try { self.onopen({ type: 'open' }); } catch (e) {}
                }
                (self.listeners.open || []).forEach(function(fn) {
                  try { fn({ type: 'open' }); } catch (e) {}
                });
              }, 20);
            } else {
              return new OriginalWebSocket(url, protocols);
            }
          }

          MockViteWebSocket.prototype.addEventListener = function(type, fn) {
            if (!this.listeners) this.listeners = {};
            if (!this.listeners[type]) this.listeners[type] = [];
            this.listeners[type].push(fn);
          };

          MockViteWebSocket.prototype.removeEventListener = function(type, fn) {
            if (!this.listeners || !this.listeners[type]) return;
            this.listeners[type] = this.listeners[type].filter(function(h) { return h !== fn; });
          };

          MockViteWebSocket.prototype.send = function() {};
          MockViteWebSocket.prototype.close = function() {
            this.readyState = 3; // CLOSED
          };

          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;

          window.WebSocket = MockViteWebSocket;
        }

        // Suppress Vite HMR console errors & Telegram WebApp version warning logs
        var origError = console.error;
        console.error = function() {
          var str = Array.prototype.join.call(arguments, ' ');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1 || str.indexOf('failed to connect to websocket') !== -1 || str.indexOf('[vite]') !== -1 || str.indexOf('[Telegram.WebApp]') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };

        // Polyfill Telegram WebApp for version < 6.2 compatibility
        function patchTelegram() {
          if (window.Telegram && window.Telegram.WebApp && !window.Telegram.WebApp.__patched) {
            var twa = window.Telegram.WebApp;
            twa.__patched = true;
            var isAtLeast = function(ver) {
              try {
                if (typeof twa.isVersionAtLeast === 'function') return Boolean(twa.isVersionAtLeast(ver));
                return parseFloat(twa.version || '6.0') >= parseFloat(ver);
              } catch (e) { return false; }
            };
            var origShowPopup = twa.showPopup;
            twa.showPopup = function(params, callback) {
              if (isAtLeast('6.2') && typeof origShowPopup === 'function') {
                try { return origShowPopup.call(twa, params, callback); } catch (e) {}
              }
              if (typeof callback === 'function') {
                var btnId = (params && params.buttons && params.buttons[0] && (params.buttons[0].id || params.buttons[0].type)) || 'ok';
                setTimeout(function() { try { callback(btnId); } catch (e) {} }, 50);
              }
            };
            var origShowAlert = twa.showAlert;
            twa.showAlert = function(msg, callback) {
              if (isAtLeast('6.2') && typeof origShowAlert === 'function') {
                try { return origShowAlert.call(twa, msg, callback); } catch (e) {}
              }
              if (typeof callback === 'function') {
                setTimeout(function() { try { callback(); } catch (e) {} }, 50);
              }
            };
            var origShowConfirm = twa.showConfirm;
            twa.showConfirm = function(msg, callback) {
              if (isAtLeast('6.2') && typeof origShowConfirm === 'function') {
                try { return origShowConfirm.call(twa, msg, callback); } catch (e) {}
              }
              if (typeof callback === 'function') {
                setTimeout(function() { try { callback(true); } catch (e) {} }, 50);
              }
            };
            var origEnableClosing = twa.enableClosingConfirmation;
            twa.enableClosingConfirmation = function() {
              if (isAtLeast('6.2') && typeof origEnableClosing === 'function') {
                try { return origEnableClosing.call(twa); } catch (e) {}
              }
            };
            var origDisableClosing = twa.disableClosingConfirmation;
            twa.disableClosingConfirmation = function() {
              if (isAtLeast('6.2') && typeof origDisableClosing === 'function') {
                try { return origDisableClosing.call(twa); } catch (e) {}
              }
            };
          }
        }
        patchTelegram();
        var twaPoll = setInterval(patchTelegram, 50);
        setTimeout(function() { clearInterval(twaPoll); }, 5000);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('[Telegram.WebApp]') !== -1 || msg.indexOf('showPopup') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('[Telegram.WebApp]') !== -1 || msg.indexOf('showPopup') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
    <style id="admin-global-theme-system">
      /* 1. Admin CSS Variables - Fallback tokens scoped to html.admin-active or .admin-layout */
      html.admin-active, body.admin-active, .admin-layout {
        color-scheme: light;
        --admin-bg-base: #f8fafc;
        --admin-bg-page: #f8fafc;
        --admin-bg-surface: #ffffff;
        --admin-bg-subtle: #f1f5f9;
        --admin-card-bg: #ffffff;
        --admin-sidebar-bg: #ffffff;
        --admin-header-bg: rgba(255, 255, 255, 0.95);
        --admin-header-color: #0f172a;
        --admin-header-border: rgba(226, 232, 240, 0.9);
        --admin-sidebar-border: rgba(226, 232, 240, 0.9);
        --admin-text-base: #0f172a;
        --admin-subtext-base: #64748b;
        --admin-text-color: #0f172a;
        --admin-subtext-color: #64748b;
        --admin-border-base: rgba(226, 232, 240, 0.9);
        --admin-border-color: rgba(226, 232, 240, 0.9);
        --admin-card-border: rgba(226, 232, 240, 0.9);
        --admin-page-bg: #f8fafc;
        --admin-input-bg: #ffffff;
        --admin-dropdown-bg: #ffffff;
        --admin-table-header-bg: #f8fafc;
      }
      html.admin-active[data-mode="dark"], html.admin-active.dark, body.admin-active.dark, .admin-layout.dark, .admin-layout[data-mode="dark"] {
        color-scheme: dark;
        --admin-bg-base: #0b0f19;
        --admin-bg-page: #0b0f19;
        --admin-bg-surface: #161f30;
        --admin-bg-subtle: #0f172a;
        --admin-card-bg: #161f30;
        --admin-sidebar-bg: #0f172a;
        --admin-header-bg: rgba(11, 17, 30, 0.92);
        --admin-header-color: #f8fafc;
        --admin-header-border: rgba(255, 255, 255, 0.08);
        --admin-sidebar-border: rgba(255, 255, 255, 0.08);
        --admin-text-base: #f8fafc;
        --admin-subtext-base: #94a3b8;
        --admin-text-color: #f8fafc;
        --admin-subtext-color: #94a3b8;
        --admin-border-base: rgba(255, 255, 255, 0.08);
        --admin-border-color: rgba(255, 255, 255, 0.08);
        --admin-card-border: rgba(255, 255, 255, 0.08);
        --admin-page-bg: #0b0f19;
        --admin-input-bg: rgba(255, 255, 255, 0.05);
        --admin-dropdown-bg: #1e293b;
        --admin-table-header-bg: #0f172a;
      }

      /* 2. Base Page Backgrounds (Driven by reactive CSS variables) */
      html.admin-active body, body.admin-active {
        background: var(--admin-page-bg, #f8fafc) !important;
        background-attachment: fixed !important;
        background-size: cover !important;
        color: var(--admin-text-color, #0f172a) !important;
      }

      /* 3. Admin Header & Sidebar (Driven by reactive CSS variables) */
      html.admin-active .admin-header, html.admin-active .app-sticky-header, html.admin-active header.ant-layout-header,
      .admin-layout .admin-header {
        background: var(--admin-header-bg, rgba(255, 255, 255, 0.95)) !important;
        color: var(--admin-header-color, #0f172a) !important;
        border-bottom: 1px solid var(--admin-header-border, rgba(226, 232, 240, 0.9)) !important;
        box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04) !important;
        backdrop-filter: var(--admin-header-backdrop, blur(16px));
        -webkit-backdrop-filter: var(--admin-header-backdrop, blur(16px));
      }
      html.admin-active .ant-layout-sider, html.admin-active aside.ant-layout-sider,
      .admin-layout .ant-layout-sider {
        background: var(--admin-sidebar-bg, #ffffff) !important;
        border-right: 1px solid var(--admin-sidebar-border, rgba(226, 232, 240, 0.9)) !important;
        box-shadow: 2px 0 16px rgba(15, 23, 42, 0.04) !important;
        backdrop-filter: var(--admin-sidebar-backdrop, none);
        -webkit-backdrop-filter: var(--admin-sidebar-backdrop, none);
      }
      html.admin-active .admin-layout, html.admin-active .admin-layout .ant-layout-content,
      .admin-layout, .admin-layout .ant-layout-content {
        background: var(--admin-page-bg, #f8fafc) !important;
        background-attachment: fixed !important;
        background-size: cover !important;
        color: var(--admin-text-color, #0f172a) !important;
      }

      /* 4. Cards & Content Panels inside Admin (Driven by reactive CSS variables) */
      html.admin-active .ant-card, .admin-layout .ant-card {
        background: var(--admin-card-bg, #ffffff) !important;
        border-color: var(--admin-card-border, rgba(226, 232, 240, 0.9)) !important;
        color: var(--admin-text-color, #0f172a) !important;
        backdrop-filter: var(--admin-card-backdrop, none);
        -webkit-backdrop-filter: var(--admin-card-backdrop, none);
      }
      html.admin-active .ant-card-head, .admin-layout .ant-card-head {
        background: var(--admin-card-bg, #ffffff) !important;
        border-bottom-color: var(--admin-card-border, rgba(226, 232, 240, 0.9)) !important;
        color: var(--admin-text-color, #0f172a) !important;
      }
      html.admin-active .ant-card-head-title, .admin-layout .ant-card-head-title {
        color: var(--admin-text-color, #0f172a) !important;
      }

      /* 5. Tables inside Admin */
      html.admin-active .ant-table-wrapper .ant-table, .admin-layout .ant-table {
        background: var(--admin-card-bg, #ffffff) !important;
        color: var(--admin-text-color, #0f172a) !important;
        backdrop-filter: var(--admin-card-backdrop, none);
        -webkit-backdrop-filter: var(--admin-card-backdrop, none);
      }
      html.admin-active .ant-table-thead > tr > th, .admin-layout .ant-table-thead > tr > th {
        background: var(--admin-table-header-bg, #f8fafc) !important;
        color: var(--admin-subtext-color, #475569) !important;
        border-bottom: 1px solid var(--admin-border-color, rgba(226, 232, 240, 0.9)) !important;
        font-weight: 600 !important;
      }
      html.admin-active .ant-table-tbody > tr > td, .admin-layout .ant-table-tbody > tr > td {
        background: var(--admin-card-bg, #ffffff) !important;
        color: var(--admin-text-color, #0f172a) !important;
        border-bottom: 1px solid var(--admin-border-color, rgba(226, 232, 240, 0.6)) !important;
      }
      html.admin-active .ant-table-tbody > tr:hover > td, .admin-layout .ant-table-tbody > tr:hover > td {
        background: var(--admin-hover-bg, #f1f5f9) !important;
      }

      /* 6. Form Controls & Inputs inside Admin */
      html.admin-active .admin-layout .ant-input, html.admin-active .admin-layout .ant-input-affix-wrapper, html.admin-active .admin-layout .ant-input-number,
      .admin-layout .ant-input, .admin-layout .ant-input-affix-wrapper, .admin-layout .ant-input-number {
        background-color: var(--admin-input-bg, #ffffff) !important;
        color: var(--admin-text-color, #0f172a) !important;
        border-color: var(--admin-border-color, #cbd5e1) !important;
      }
      html.admin-active .admin-layout .ant-select-selector, .admin-layout .ant-select-selector {
        background-color: var(--admin-input-bg, #ffffff) !important;
        color: var(--admin-text-color, #0f172a) !important;
        border-color: var(--admin-border-color, #cbd5e1) !important;
      }
      html.admin-active .admin-layout .ant-select-dropdown, .admin-layout .ant-select-dropdown {
        background-color: var(--admin-dropdown-bg, #ffffff) !important;
        border: 1px solid var(--admin-border-color, #e2e8f0) !important;
      }

      /* 7. Modals & Drawers inside Admin */
      html.admin-active .ant-modal-content, html.admin-active .ant-drawer-content,
      .admin-layout .ant-modal-content, .admin-layout .ant-drawer-content {
        background-color: var(--admin-card-bg, #ffffff) !important;
        color: var(--admin-text-color, #0f172a) !important;
        border: 1px solid var(--admin-border-color, #e2e8f0) !important;
      }
      html.admin-active .ant-modal-header, html.admin-active .ant-drawer-header,
      .admin-layout .ant-modal-header, .admin-layout .ant-drawer-header {
        background-color: var(--admin-card-bg, #ffffff) !important;
        border-bottom: 1px solid var(--admin-border-color, #e2e8f0) !important;
      }

      /* 8. Typography inside Admin */
      html.admin-active .admin-layout .ant-typography, html.admin-active .admin-layout .ant-statistic-content,
      .admin-layout .ant-typography, .admin-layout .ant-statistic-content {
        color: var(--admin-text-color, #0f172a) !important;
      }
      html.admin-active .admin-layout .ant-statistic-title, html.admin-active .admin-layout .ant-descriptions-item-label,
      .admin-layout .ant-statistic-title, .admin-layout .ant-descriptions-item-label {
        color: var(--admin-subtext-color, #64748b) !important;
      }
    </style>
    <script>
      (function() {
        try {
          var isAdmin = window.location.pathname.startsWith('/admins');
          var doc = document.documentElement;
          if (isAdmin) {
            var mode = localStorage.getItem('admin-theme') || localStorage.getItem('admin-theme-mode') || 'light';
            var preset = localStorage.getItem('admin-theme-preset') || 'default';
            doc.classList.add('admin-active');
            doc.setAttribute('data-mode', mode);
            doc.setAttribute('data-theme', preset);
            doc.classList.remove('light', 'dark', 'theme-light', 'theme-dark');
            doc.classList.add(mode, 'theme-' + mode);
            doc.style.colorScheme = mode;
          } else {
            // Strictly enforce clean default light mode on all public customer-facing website routes
            doc.classList.remove('admin-active', 'dark', 'theme-dark');
            doc.classList.add('light', 'theme-light');
            doc.setAttribute('data-mode', 'light');
            doc.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

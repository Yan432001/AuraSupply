    <title>Aura Global</title>
    <meta name="description" content="Aura Global multi-store E-Menu, Telegram Mini App ordering system, and hospitality portal." />
    <meta property="og:title" content="Aura Global" />
    <meta property="og:description" content="Aura Global multi-store E-Menu, Telegram Mini App ordering system, and hospitality portal." />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('admin-theme') || localStorage.getItem('admin-theme-mode') || localStorage.getItem('theme-mode') || 'light';
          var preset = localStorage.getItem('admin-theme-preset') || 'default';
          var doc = document.documentElement;
          doc.setAttribute('data-mode', mode);
          doc.setAttribute('data-theme', preset);
          doc.classList.remove('light', 'dark', 'theme-light', 'theme-dark');
          doc.classList.add(mode, 'theme-' + mode);
          doc.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>

  </body>
